<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="320" height="320" role="img" aria-label="Aquanor mark v2a — Flow Wave A">
  <defs>
    <linearGradient id="bg-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1d23"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="str-a" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b8480f"/>
      <stop offset="0.5" stop-color="#ff6b1a"/>
      <stop offset="1" stop-color="#ffd9b8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg-a)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#2a2d36" stroke-width="1"/>
  <!-- Outer A (lightest) -->
  <path d="M9 53 L32 11 L55 53 M21 39 H43" fill="none" stroke="url(#str-a)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
  <!-- Middle A -->
  <path d="M14 53 L32 17 L50 53 M23 41 H41" fill="none" stroke="url(#str-a)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.62"/>
  <!-- Inner A (deepest, brightest) -->
  <path d="M19 53 L32 23 L45 53 M26 43 H38" fill="none" stroke="url(#str-a)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flow arrowhead at bottom-right of inner A -->
  <path d="M45 53 L42 47 L48 48 Z" fill="#ff6b1a"/>
  <!-- Flow particle cluster (circulation) -->
  <circle cx="50" cy="13" r="1.7" fill="#ff6b1a" opacity="0.95"/>
  <circle cx="56" cy="17" r="1.1" fill="#ffd9b8" opacity="0.7"/>
  <circle cx="54" cy="22" r="0.6" fill="#ffd9b8" opacity="0.45"/>
</svg>