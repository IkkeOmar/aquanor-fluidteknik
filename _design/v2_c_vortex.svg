<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="320" height="320" role="img" aria-label="Aquanor mark v2c — Vortex A">
  <defs>
    <linearGradient id="bg-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1d23"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="str-c" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b8480f"/>
      <stop offset="1" stop-color="#ffd9b8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg-c)"/>

  <!-- Vortex: spiral of nested arcs that traces an "A" silhouette -->
  <!-- Left leg of A as a curve -->
  <path d="M10 54 C 12 38, 18 24, 32 12 C 46 24, 52 38, 54 54"
        fill="none" stroke="url(#str-c)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Inner curl that forms the negative space -->
  <path d="M22 54 C 24 44, 28 34, 32 28 C 36 34, 40 44, 42 54"
        fill="none" stroke="url(#str-c)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Crossbar/horizontal pipe -->
  <path d="M22 42 L42 42"
        fill="none" stroke="url(#str-c)" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>

  <!-- Small terminal dots (flow inlet/outlet) -->
  <circle cx="10" cy="54" r="2" fill="#ff6b1a"/>
  <circle cx="54" cy="54" r="2" fill="#ff6b1a"/>
  <circle cx="32" cy="12" r="1.5" fill="#ffd9b8"/>
</svg>