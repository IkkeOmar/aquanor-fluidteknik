<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="320" height="320" role="img" aria-label="Aquanor mark v2 — Flow Wave A">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1d23"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b8480f"/>
      <stop offset="0.5" stop-color="#ff6b1a"/>
      <stop offset="1" stop-color="#ffb98a"/>
    </linearGradient>
    <linearGradient id="strokeDeep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b1a"/>
      <stop offset="1" stop-color="#ffb98a"/>
    </linearGradient>
  </defs>

  <!-- Tile background with rounded corner -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle inner border for depth -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#2a2d36" stroke-width="1"/>

  <!-- Three stacked rightward-leaning A's forming flow fronts -->
  <!-- Outer (lightest, biggest, opacity 0.35) -->
  <path d="M10 52 L32 12 L54 52 M22 38 H42"
        fill="none" stroke="url(#stroke)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <!-- Middle (mid opacity) -->
  <path d="M15 52 L32 18 L49 52 M23 40 H41"
        fill="none" stroke="url(#stroke)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <!-- Inner (full opacity, deepest) -->
  <path d="M20 52 L32 24 L44 52 M26 42 H38"
        fill="none" stroke="url(#strokeDeep)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flow arrowhead terminations on inner A's right leg, suggesting flow direction down-pipe -->
  <path d="M44 52 L42 47 L46 47 Z" fill="#ff6b1a"/>

  <!-- Small flow particle cluster top-right (circulation signature) -->
  <circle cx="50" cy="14" r="1.8" fill="#ff6b1a" opacity="0.95"/>
  <circle cx="56" cy="18" r="1.2" fill="#ffb98a" opacity="0.7"/>
  <circle cx="54" cy="24" r="0.7" fill="#ffb98a" opacity="0.5"/>
</svg>
