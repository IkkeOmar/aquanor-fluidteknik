<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="320" height="320" role="img" aria-label="Aquanor mark v2b — Pipe Cross A">
  <defs>
    <linearGradient id="bg-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1d23"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="str-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9b8"/>
      <stop offset="0.5" stop-color="#ff6b1a"/>
      <stop offset="1" stop-color="#b8480f"/>
    </linearGradient>
    <radialGradient id="dot-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9b8"/>
      <stop offset="1" stop-color="#ff6b1a"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg-b)"/>

  <!-- Negative-space A formed by removing a triangle from a square block -->
  <!-- Outer A silhouette as a filled shape -->
  <path d="M32 8 L8 56 H22 L26 47 L38 47 L42 56 H56 Z M30 35 L32 30 L34 35 Z"
        fill="url(#str-b)"/>

  <!-- Pipe cross-section overlay: a horizontal cylinder band crossing the middle -->
  <rect x="6" y="42" width="52" height="6" fill="#0d1117" stroke="url(#str-b)" stroke-width="1.5"/>
  <!-- Inner pipe bore indication (concentric) -->
  <rect x="10" y="44" width="44" height="2" fill="none" stroke="#ff6b1a" stroke-width="0.6" opacity="0.5"/>

  <!-- Single flow dot inside pipe suggesting flow direction -->
  <circle cx="22" cy="45" r="1.3" fill="url(#dot-b)"/>
  <circle cx="42" cy="45" r="1.3" fill="url(#dot-b)"/>

  <!-- Apex highlight (fluid meeting point) -->
  <circle cx="32" cy="8" r="2" fill="#ffd9b8" opacity="0.9"/>
</svg>